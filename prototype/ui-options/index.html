<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FaceE UI 方案预览（原型）</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #dfe7e6; color: #102a2b; display: grid; place-items: center; padding: 28px 20px 100px; }
    button { font: inherit; }
    .prototype-shell { width: min(100%, 1180px); display: grid; grid-template-columns: minmax(320px, 390px) minmax(260px, 1fr); gap: 56px; align-items: center; }
    .phone { width: 390px; min-height: 844px; max-width: 100%; overflow: hidden; border-radius: 34px; background: #f6fbfa; box-shadow: 0 22px 60px #163d3c2b, 0 3px 8px #163d3c18; position: relative; }
    .status { height: 34px; padding: 14px 20px 0; display: flex; justify-content: space-between; color: #607675; font-size: 11px; letter-spacing: .04em; }
    .screen { min-height: 810px; padding: 24px 22px 38px; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 34px; line-height: 1.08; letter-spacing: -.04em; }
    h2 { font-size: 18px; line-height: 1.2; }
    .muted { color: #6b7d7c; }
    .tiny { font-size: 12px; line-height: 1.5; }
    .copy { font-size: 15px; line-height: 1.55; }
    .stack { display: grid; gap: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .rule { height: 1px; background: #dce7e5; }
    .pill { display: inline-flex; align-items: center; min-height: 32px; padding: 0 13px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; font-weight: 800; }
    .arrow { font-size: 22px; line-height: 1; }

    /* A: calm reader — whitespace and dividers carry hierarchy. */
    .a { background: #f6fbfa; }
    .a .eyebrow { color: #087f78; }
    .a h1 { margin-top: 10px; color: #102a2b; }
    .a .intro { margin-top: 12px; max-width: 300px; }
    .a .resume { margin-top: 30px; padding: 15px 0; border-top: 2px solid #0aa396; border-bottom: 1px solid #dce7e5; }
    .a .resume .icon { background: #d6f4ef; color: #087f78; }
    .a .section { margin-top: 30px; }
    .a .section-title { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .a .section-title h2 { font-size: 20px; }
    .a .category { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
    .a .category button { border: 0; border-bottom: 1px solid #dce7e5; background: transparent; padding: 17px 0; text-align: left; color: #102a2b; display: flex; justify-content: space-between; align-items: center; }
    .a .category button:first-child, .a .category button:nth-child(2) { border-top: 2px solid #102a2b; }
    .a .category .count { color: #6b7d7c; font-size: 12px; }
    .a .bottom-note { margin-top: 30px; padding-top: 16px; color: #6b7d7c; border-top: 1px solid #dce7e5; }

    /* B: editorial — strong dark header and one prominent progress rail. */
    .b { background: #f5f8fb; padding: 0; }
    .b .hero { padding: 26px 22px 22px; background: #102a46; color: #fff; border-radius: 0 0 28px 28px; }
    .b .hero .eyebrow { color: #8fe4d7; }
    .b h1 { margin-top: 28px; max-width: 270px; }
    .b .hero .copy { margin-top: 12px; color: #b7c7d4; }
    .b .progress { margin-top: 24px; }
    .b .progress-bar { height: 6px; border-radius: 6px; background: #2d4860; overflow: hidden; }
    .b .progress-bar i { display: block; width: 42%; height: 100%; background: #8fe4d7; }
    .b .progress-copy { margin-top: 8px; color: #b7c7d4; }
    .b .body { padding: 24px 22px 38px; }
    .b .tabs { display: flex; gap: 10px; overflow: hidden; margin: 0 -22px 24px; padding: 0 22px 2px; }
    .b .tabs button { border: 0; background: transparent; color: #728394; padding: 0 0 10px; white-space: nowrap; font-weight: 700; }
    .b .tabs button.active { color: #102a46; border-bottom: 3px solid #0aa396; }
    .b .queue { display: grid; gap: 0; }
    .b .queue-item { display: grid; grid-template-columns: 34px 1fr 24px; gap: 12px; align-items: center; min-height: 78px; border-bottom: 1px solid #dce3e9; }
    .b .queue-item .num { color: #0aa396; font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 800; }
    .b .queue-item .title { font-weight: 700; line-height: 1.35; }
    .b .queue-item .meta { margin-top: 4px; color: #728394; font-size: 12px; }
    .b .queue-item .arrow { color: #8da0ad; }

    /* C: focus mode — a single queue and tonal sections, almost no outlines. */
    .c { background: #fbf7ef; color: #2d2b25; }
    .c .eyebrow { color: #b46b2b; }
    .c h1 { margin-top: 12px; max-width: 290px; }
    .c .hero-copy { margin-top: 12px; color: #756f64; }
    .c .today { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; margin-top: 34px; padding: 22px; background: #e9f4ef; border-radius: 22px; }
    .c .today .number { font-size: 54px; line-height: .9; letter-spacing: -.06em; color: #166d61; }
    .c .today .label { margin-top: 8px; color: #52746c; font-size: 13px; }
    .c .today .target { align-self: center; padding: 10px 12px; border-radius: 14px; background: #fff; color: #166d61; font-size: 12px; font-weight: 800; }
    .c .section { margin-top: 34px; }
    .c .section-heading { display: flex; align-items: end; justify-content: space-between; margin-bottom: 10px; }
    .c .section-heading h2 { font-size: 22px; }
    .c .question { padding: 19px 0; border-bottom: 1px solid #ded8cd; }
    .c .question:first-of-type { border-top: 1px solid #ded8cd; }
    .c .question .pill { background: #f6dfc8; color: #9a5b24; }
    .c .question-title { margin-top: 10px; font-size: 16px; line-height: 1.4; font-weight: 750; }
    .c .question-meta { margin-top: 7px; color: #81796e; font-size: 12px; }
    .c .cta { margin-top: 26px; width: 100%; min-height: 50px; border: 0; border-radius: 16px; color: #fff; background: #166d61; font-weight: 800; }

    .notes { align-self: center; }
    .notes .eyebrow { color: #087f78; }
    .notes h2 { margin-top: 10px; font-size: 28px; line-height: 1.18; letter-spacing: -.03em; color: #102a2b; }
    .notes > p { margin-top: 14px; max-width: 500px; color: #506866; line-height: 1.65; }
    .notes dl { margin: 30px 0 0; display: grid; gap: 20px; }
    .notes dt { font-weight: 800; color: #102a2b; }
    .notes dd { margin: 5px 0 0; color: #607675; line-height: 1.55; }
    .swatches { display: flex; gap: 8px; margin-top: 24px; }
    .swatches i { width: 28px; height: 28px; border-radius: 9px; display: block; }
    .switcher { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; padding: 10px 14px; border-radius: 999px; background: #102a2b; color: #fff; box-shadow: 0 12px 30px #102a2b3b; z-index: 5; }
    .switcher button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: #294a49; color: #fff; cursor: pointer; font-size: 20px; }
    .switcher button:hover { background: #39716d; }
    .switcher .label { min-width: 150px; text-align: center; font-size: 12px; font-weight: 700; }
    .prototype-badge { position: fixed; top: 16px; right: 18px; padding: 7px 10px; border-radius: 999px; background: #fff; color: #607675; font-size: 11px; font-weight: 800; letter-spacing: .06em; box-shadow: 0 3px 12px #163d3c16; }
    @media (max-width: 760px) { body { padding: 16px 12px 92px; } .prototype-shell { grid-template-columns: 1fr; justify-items: center; gap: 24px; } .notes { width: min(390px, 100%); } .phone { min-height: 780px; } }
  </style>
</head>
<body>
  <div class="prototype-badge">PROTOTYPE · 非生产页面</div>
  <main class="prototype-shell">
    <section class="phone" id="phone"></section>
    <aside class="notes" id="notes"></aside>
  </main>
  <nav class="switcher" aria-label="方案切换">
    <button id="prev" aria-label="上一个方案">‹</button>
    <span class="label" id="variant-label"></span>
    <button id="next" aria-label="下一个方案">›</button>
  </nav>
  <script>
    const variants = {
      a: {
        name: 'A · Calm Reader',
        title: '留白阅读型',
        description: '用字号、留白和细分隔线建立层级。适合每天长时间阅读题目、答案和解析。',
        colors: ['#f6fbfa', '#0aa396', '#102a2b', '#d6f4ef'],
        render: () => `
          <div class="status"><span>7:26</span><span>5G　▮</span></div>
          <div class="screen a">
            <div class="eyebrow">FaceE · 离线题库</div>
            <h1>今天想练什么？</h1>
            <p class="copy muted intro">按领域进入题库，搜索重点问题，并在答案中继续追问。</p>
            <div class="resume row"><div class="row"><span class="icon">→</span><span><strong>继续上次</strong><br><span class="tiny muted">HashMap 的工作原理是什么？</span></span></div><span class="arrow">›</span></div>
            <div class="section"><div class="section-title"><h2>选择学习领域</h2><span class="tiny muted">20 道题</span></div><div class="category"><button><span>Java</span><span class="count">5 题　›</span></button><button><span>Spring</span><span class="count">2 题　›</span></button><button><span>数据库</span><span class="count">6 题　›</span></button><button><span>系统设计</span><span class="count">4 题　›</span></button><button><span>JVM</span><span class="count">2 题　›</span></button><button><span>Redis</span><span class="count">2 题　›</span></button></div></div>
            <p class="tiny bottom-note">内容来自本机题库　·　离线可用</p>
          </div>`,
      },
      b: {
        name: 'B · Editorial Focus',
        title: '深色聚焦型',
        description: '用深色头部、单条进度轨和紧凑题目队列突出“继续刷题”这条主路径。适合连续练习。',
        colors: ['#102a46', '#8fe4d7', '#f5f8fb', '#0aa396'],
        render: () => `
          <div class="status"><span>7:26</span><span>5G　▮</span></div>
          <div class="b">
            <div class="hero"><div class="eyebrow">FaceE · 今日练习</div><h1>保持节奏，下一题马上开始。</h1><p class="copy">上次停在 Java 基础，今天继续完成一组。</p><div class="progress"><div class="progress-bar"><i></i></div><div class="tiny progress-copy">已完成 4 / 10　　预计还需 12 分钟</div></div></div>
            <div class="body"><div class="tabs"><button class="active">全部 20</button><button>Java 5</button><button>数据库 6</button><button>设计 4</button></div><div class="queue"><div class="queue-item"><span class="num">01</span><span><span class="title">HashMap 的工作原理是什么？</span><br><span class="meta">Java　·　简单　·　已看过</span></span><span class="arrow">›</span></div><div class="queue-item"><span class="num">02</span><span><span class="title">接口和抽象类应该如何选择？</span><br><span class="meta">Java　·　简单　·　下一题</span></span><span class="arrow">›</span></div><div class="queue-item"><span class="num">03</span><span><span class="title">为什么重写 equals 时必须重写 hashCode？</span><br><span class="meta">Java　·　简单</span></span><span class="arrow">›</span></div><div class="queue-item"><span class="num">04</span><span><span class="title">如何定位和优化一条慢 SQL？</span><br><span class="meta">数据库　·　中等</span></span><span class="arrow">›</span></div><div class="queue-item"><span class="num">05</span><span><span class="title">联合索引为什么要遵循最左匹配原则？</span><br><span class="meta">SQL　·　中等</span></span><span class="arrow">›</span></div></div></div>
          </div>`,
      },
      c: {
        name: 'C · Daily Focus',
        title: '今日任务型',
        description: '用一个明确的今日目标承接进度，题目列表只保留必要信息。适合打卡和碎片时间刷题。',
        colors: ['#fbf7ef', '#166d61', '#e9f4ef', '#f6dfc8'],
        render: () => `
          <div class="status"><span>7:26</span><span>5G　▮</span></div>
          <div class="screen c"><div class="eyebrow">FaceE · 今日练习</div><h1>十道题，完成今天的训练。</h1><p class="copy hero-copy">不用想太多，从下一道开始。题目和答案都保存在本机。</p><div class="today"><div><div class="number">04</div><div class="label">已完成题目</div></div><div class="target">今日目标 10 题</div></div><div class="section"><div class="section-heading"><h2>继续刷题</h2><span class="tiny">剩余 6 题</span></div><div class="question"><span class="pill">Java · 简单</span><div class="question-title">接口和抽象类应该如何选择？</div><div class="question-meta">下一题　·　约 3 分钟</div></div><div class="question"><span class="pill">Java · 简单</span><div class="question-title">为什么重写 equals 时必须重写 hashCode？</div><div class="question-meta">再下一题　·　约 3 分钟</div></div><div class="question"><span class="pill">数据库 · 中等</span><div class="question-title">联合索引为什么要遵循最左匹配原则？</div><div class="question-meta">第 3 题　·　约 4 分钟</div></div><button class="cta">开始连续刷题　→</button></div></div>`,
      },
    };

    const keys = Object.keys(variants);
    const phone = document.getElementById('phone');
    const notes = document.getElementById('notes');
    const label = document.getElementById('variant-label');
    let current = new URLSearchParams(location.search).get('variant')?.toLowerCase();
    if (!variants[current]) current = 'a';

    function render() {
      const variant = variants[current];
      phone.innerHTML = variant.render();
      notes.innerHTML = `<div class="eyebrow">方案 ${current.toUpperCase()}</div><h2>${variant.title}</h2><p>${variant.description}</p><dl><div><dt>层级表达</dt><dd>${current === 'a' ? '字号 + 留白 + 分隔线；不依赖卡片边框。' : current === 'b' ? '深色头部承载主任务，列表用行距和编号分组。' : '色调区块承载任务状态，题目本身保持轻量。'}</dd></div><div><dt>适合场景</dt><dd>${current === 'a' ? '答案阅读、搜索、收藏、长时间学习。' : current === 'b' ? '连续刷题、进度追踪、按筛选队列练习。' : '每日目标、碎片时间、快速进入下一题。'}</dd></div><div><dt>实现成本</dt><dd>沿用现有 React Native 组件和导航，只需调整主题令牌与页面布局。</dd></div></dl><div class="swatches">${variant.colors.map(color => `<i style="background:${color}" title="${color}"></i>`).join('')}</div>`;
      label.textContent = variant.name;
      const url = new URL(location.href); url.searchParams.set('variant', current); history.replaceState(null, '', url);
    }
    function step(direction) { current = keys[(keys.indexOf(current) + direction + keys.length) % keys.length]; render(); }
    document.getElementById('prev').addEventListener('click', () => step(-1));
    document.getElementById('next').addEventListener('click', () => step(1));
    document.addEventListener('keydown', event => { if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return; if (event.key === 'ArrowLeft') step(-1); if (event.key === 'ArrowRight') step(1); });
    render();
  </script>
</body>
</html>
